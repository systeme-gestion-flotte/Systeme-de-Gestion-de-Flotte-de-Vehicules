apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-service
  namespace: fleet-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maintenance-service
  template:
    metadata:
      labels:
        app: maintenance-service
    spec:
      containers:
        - name: maintenance-service
          image: fleet-maintenance-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://admin:adminpassword@postgres-postgresql:5432/maintenance_db"
            - name: KAFKA_BROKER
              value: "fleet-kafka-kafka-bootstrap:9092"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"