name: CI/CD - Fleet Management

on:
  push:
    branches:
      - main
      - feature/maintenance-service
      - feature/localisation-service
      - feature/conducteur-service
  pull_request:
    branches:
      - main
      - feature/maintenance-service
      - feature/localisation-service
      - feature/conducteur-service

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build vehicule-service (Spring Boot)
        run: docker build -t fleet-vehicule-service:latest ./services/vehicule-service

      - name: Build conducteur-service (NestJS)
        run: docker build -t fleet-conducteur-service:latest ./services/conducteur-service

      - name: Build maintenance-service (FastAPI)
        run: docker build -t fleet-maintenance-service:latest ./services/maintenance-service

      - name: Build evenement-service (FastAPI)
        run: docker build -t fleet-evenement-service:latest ./services/evenement-service

      - name: Build localisation-service (gRPC)
        run: docker build -t fleet-localisation-service:latest ./services/localisation-service

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer kubeval
        run: |
          curl -sL https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz
          sudo mv kubeval /usr/local/bin/

      - name: Valider les manifests YAML
        run: kubeval --ignore-missing-schemas infrastructure/kubernetes/**/*.yaml

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            services/conducteur-service/package-lock.json
            services/localisation-service/package-lock.json

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Test vehicule-service (Java)
        working-directory: ./services/vehicule-service
        run: |
          if [ -f "pom.xml" ]; then
            mvn test -DskipTests=false
          else
            echo "Pas de pom.xml trouvé - tests ignorés"
          fi

      - name: Install dependencies conducteur-service
        working-directory: ./services/conducteur-service
        run: npm ci

      - name: Test conducteur-service (Node.js)
        working-directory: ./services/conducteur-service
        run: npm test

      - name: Install dependencies localisation-service
        working-directory: ./services/localisation-service
        run: npm ci

      - name: Test localisation-service (gRPC)
        working-directory: ./services/localisation-service
        run: npm test

      - name: Test maintenance-service (Python)
        working-directory: ./services/maintenance-service
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
            python -m pytest
          else
            echo "Pas de requirements.txt trouvé - tests ignorés"
          fi

      - name: Test evenement-service (Python)
        working-directory: ./services/evenement-service
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
            python -m pytest
          else
            echo "Pas de requirements.txt trouvé - tests ignorés"
          fi
