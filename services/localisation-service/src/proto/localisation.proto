syntax = "proto3";

package localisation;

service LocalisationService {
  // Flux bidirectionnel pour envoyer les positions GPS en continu
  rpc StreamPositions (stream Position) returns (stream Ack) {}

  // Requête unaire pour consulter l'historique des positions d'un véhicule
  rpc GetHistorique (HistoriqueRequest) returns (HistoriqueResponse) {}
}

// Format des coordonnées GPS envoyées par les véhicules
message Position {
  string vehicule_id = 1;
  double latitude    = 2;
  double longitude   = 3;
  double vitesse     = 4;
  string horodatage  = 5;
}

// Accusé de réception renvoyé par le serveur
message Ack {
  bool   success = 1;
  string message = 2;
}

// Requête d'historique
message HistoriqueRequest {
  string vehicule_id = 1;
  string depuis      = 2;  // ISO 8601
  string jusqu_a     = 3;  // ISO 8601
}

// Réponse historique
message HistoriqueResponse {
  repeated Position positions = 1;
}
