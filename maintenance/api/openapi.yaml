openapi: 3.0.3
info:
  title: Service Maintenance API
  description: Planification, suivi des interventions et alertes préventives
  version: 1.0.0

servers:
  - url: http://localhost:3003/api/maintenance
    description: Développement local

security:
  - bearerAuth: []

paths:

  /interventions:
    get:
      summary: Liste toutes les interventions
      tags: [Interventions]
      parameters:
        - name: statut
          in: query
          schema: { $ref: '#/components/schemas/StatutIntervention' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TypeIntervention' }
        - name: vehicule_id
          in: query
          schema: { type: string, format: uuid }
        - name: technicien_id
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Intervention' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      summary: Planifier une intervention
      description: Déclenche un événement Kafka fleet.maintenance.planifiee
      tags: [Interventions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInterventionDto' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /interventions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      summary: Récupérer une intervention
      tags: [Interventions]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      summary: Mettre à jour une intervention
      tags: [Interventions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInterventionDto' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }

    delete:
      summary: Annuler une intervention planifiée
      tags: [Interventions]
      responses:
        '204': { description: Intervention annulée }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Impossible d'annuler une intervention déjà en cours ou terminée

  /interventions/{id}/demarrer:
    patch:
      summary: Démarrer une intervention (planifiée → en_cours)
      tags: [Interventions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }

  /interventions/{id}/terminer:
    patch:
      summary: Terminer une intervention (en_cours → terminée)
      description: Déclenche un événement Kafka fleet.maintenance.terminee
      tags: [Interventions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date_realisation]
              properties:
                date_realisation: { type: string, format: date-time }
                cout:             { type: number, minimum: 0 }
                description:      { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Intervention' }

  /interventions/vehicule/{vehicule_id}:
    get:
      summary: Historique des interventions d'un véhicule
      tags: [Interventions]
      parameters:
        - name: vehicule_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Intervention' }

  /interventions/planifiees/prochaines:
    get:
      summary: Interventions planifiées dans les 7 prochains jours
      description: Utile pour les alertes préventives sur le dashboard
      tags: [Interventions]
      parameters:
        - name: jours
          in: query
          schema: { type: integer, default: 7 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Intervention' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StatutIntervention:
      type: string
      enum: [planifiee, en_cours, terminee]

    TypeIntervention:
      type: string
      enum: [revision, reparation, controle_technique]

    Intervention:
      type: object
      properties:
        id_intervention:  { type: string, format: uuid }
        vehicule_id:      { type: string, format: uuid }
        vehicule_immat:   { type: string, example: "AB-123-CD" }
        technicien_id:    { type: string, description: "ID Keycloak du technicien" }
        type:             { $ref: '#/components/schemas/TypeIntervention' }
        date_planifiee:   { type: string, format: date-time }
        date_realisation: { type: string, format: date-time, nullable: true }
        statut:           { $ref: '#/components/schemas/StatutIntervention' }
        cout:             { type: number, nullable: true }
        description:      { type: string, nullable: true }
        created_at:       { type: string, format: date-time }

    CreateInterventionDto:
      type: object
      required: [vehicule_id, vehicule_immat, technicien_id, type, date_planifiee]
      properties:
        vehicule_id:    { type: string, format: uuid }
        vehicule_immat: { type: string }
        technicien_id:  { type: string }
        type:           { $ref: '#/components/schemas/TypeIntervention' }
        date_planifiee: { type: string, format: date-time }
        description:    { type: string }

    UpdateInterventionDto:
      type: object
      properties:
        date_planifiee: { type: string, format: date-time }
        technicien_id:  { type: string }
        description:    { type: string }

  responses:
    Unauthorized:
      description: Token JWT manquant ou invalide
    BadRequest:
      description: Données invalides
    NotFound:
      description: Ressource introuvable
