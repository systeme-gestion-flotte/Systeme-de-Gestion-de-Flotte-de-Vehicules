services:
  # ==========================================
  # --- 1. INFRASTRUCTURE & BASES DE DONNÉES ---
  # ==========================================
  
  postgres:
    image: postgres:15-alpine
    container_name: fleet-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fleet-network

  db-seeder:
    build:
      context: ./infra/seeder
      dockerfile: Dockerfile
    container_name: fleet-db-seeder
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleet-network

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: fleet-timescaledb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: localisation_db
    ports:
      - "5433:5432" 
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - fleet-network

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fleet-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: fleet-kafka
    user: root
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_DIRS=/tmp/kafka-logs
    volumes:
      - kafka_data_v3:/tmp/kafka-logs
    networks:
      - fleet-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fleet-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fleet-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
    depends_on:
      - kafka
    networks:
      - fleet-network

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: fleet-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_v4
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: adminpassword
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9080
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT: "false"
    command: start-dev --import-realm
    ports:
      - "9080:8080"
    volumes:
      - ./auth/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      - postgres
    networks:
      - fleet-network

  # ==========================================
  # --- 2. MICROSERVICES MÉTIERS ---
  # ==========================================

  vehicule-service:
    build:
      context: ./services/vehicule-service
      dockerfile: Dockerfile
    container_name: fleet-vehicule-service
    ports:
      - "8081:4000" 
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vehicules
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=adminpassword
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KEYCLOAK_ISSUER_URI=http://localhost:9080/realms/fleet-management
      - KEYCLOAK_JWK_URI=http://fleet-keycloak:8080/realms/fleet-management/protocol/openid-connect/certs
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=vehicule-service
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - postgres
      - kafka
    networks:
      - fleet-network

  conducteur-service:
    build:
      context: ./services/conducteur-service
      dockerfile: Dockerfile
    container_name: fleet-conducteur-service
    ports:
      - "3001:3000" 
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/conducteurs
      - KAFKA_BROKER=kafka:9092
      - KEYCLOAK_ISSUER=http://localhost:9080/realms/fleet-management
      - KEYCLOAK_JWKS_URI=http://fleet-keycloak:8080/realms/fleet-management/protocol/openid-connect/certs
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=conducteur-service
    depends_on:
      - postgres
      - kafka
    networks:
      - fleet-network

  maintenance-service:
    build:
      context: ./services/maintenance-service
      dockerfile: Dockerfile
    container_name: fleet-maintenance-service
    ports:
      - "8002:8000" 
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/maintenance
      - KAFKA_BROKER=kafka:9092
      - JWKS_URL=http://keycloak:8080/realms/fleet-management/protocol/openid-connect/certs
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=maintenance-service
      - OTEL_RESOURCE_ATTRIBUTES=service.name=maintenance-service
    depends_on:
      - postgres
      - kafka
    networks:
      - fleet-network

  evenement-service:
    build:
      context: ./services/evenement-service
      dockerfile: Dockerfile
    container_name: fleet-evenement-service
    ports:
      - "8003:8000" 
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/evenements
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKER=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=evenement-service
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - fleet-network

  localisation-service:
    build:
      context: ./services/localisation-service
      dockerfile: Dockerfile
    container_name: fleet-localisation-service
    ports:
      - "50051:50051"
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@timescaledb:5432/localisation_db
      - KAFKA_BROKER=kafka:9092
      - KEYCLOAK_ISSUER=http://localhost:9080/realms/fleet-management
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/fleet-management/protocol/openid-connect/certs
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=localisation-service
      - ENABLE_SIMULATOR=true
    depends_on:
      - timescaledb
      - kafka
    networks:
      - fleet-network

  api-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: fleet-api-gateway
    ports:
      - "4000:4000"
    environment:
      - VEHICULE_SERVICE_URL=http://vehicule-service:4000
      - CONDUCTEUR_SERVICE_URL=http://conducteur-service:3000
      - MAINTENANCE_SERVICE_URL=http://maintenance-service:8000
      - EVENEMENT_SERVICE_URL=http://evenement-service:8000
      - LOCALISATION_SERVICE_URL=http://localisation-service:3002
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=api-gateway
    depends_on:
      - vehicule-service
      - conducteur-service
      - maintenance-service
      - evenement-service
      - localisation-service
      - keycloak
    networks:
      - fleet-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleet-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_KEYCLOAK_URL=http://localhost:9080
    depends_on:
      - api-gateway
      - localisation-service
    networks:
      - fleet-network

  # ==========================================
  # --- 3. OBSERVABILITÉ & MONITORING ---
  # ==========================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: fleet-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter port
    networks:
      - fleet-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fleet-jaeger
    ports:
      - "16686:16686" # UI
      - "4317"       # OTLP gRPC (internal)
    networks:
      - fleet-network

  prometheus:
    image: prom/prometheus:latest
    container_name: fleet-prometheus
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - fleet-network

  grafana:
    image: grafana/grafana:latest
    container_name: fleet-grafana
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - fleet-network

# ==========================================
# --- 4. VOLUMES ET RÉSEAUX ---
# ==========================================
volumes:
  postgres_data:
  timescale_data:
  redis_data:
  kafka_data_v3:

networks:
  fleet-network:
    driver: bridge