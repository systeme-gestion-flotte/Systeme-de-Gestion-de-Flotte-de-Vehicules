services:
  # ==========================================
  # --- 1. INFRASTRUCTURE & BASES DE DONNÉES ---
  # ==========================================
  
  postgres:
    image: postgres:15-alpine
    container_name: fleet-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - fleet-network

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: fleet-timescaledb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: localisation_db
    ports:
      - "5433:5432" 
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - fleet-network

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fleet-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: fleet-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kafka-logs
    networks:
      - fleet-network

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: fleet-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: adminpassword
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9080
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_STRICT: "false"
    command: start-dev --import-realm
    ports:
      - "9080:8080"
    volumes:
      - ./Keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      - postgres
    networks:
      - fleet-network

  # ==========================================
  # --- 2. MICROSERVICES MÉTIERS ---
  # ==========================================

  vehicule-service:
    build:
      context: ./services/vehicule-service
      dockerfile: Dockerfile
    container_name: fleet-vehicule-service
    # Accessible sur localhost:8081
    ports:
      - "8081:4000" 
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vehicules
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=adminpassword
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KEYCLOAK_ISSUER_URI=http://localhost:9080/realms/fleet-management
      - KEYCLOAK_JWK_URI=http://keycloak:8080/realms/fleet-management/protocol/openid-connect/certs
      - OTEL_SDK_DISABLED=true
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - postgres
      - kafka
    networks:
      - fleet-network

  conducteur-service:
    build:
      context: ./services/conducteur-service
      dockerfile: Dockerfile
    container_name: fleet-conducteur-service
    ports:
      - "3001:3000" 
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/conducteurs
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - fleet-network

  maintenance-service:
    build:
      context: ./services/maintenance-service
      dockerfile: Dockerfile
    container_name: fleet-maintenance-service
    ports:
      - "8002:8000" 
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/maintenance
      - KAFKA_BROKER=kafka:9092
      - KEYCLOAK_ISSUER=http://localhost:9080/realms/fleet-management
      - JWKS_URL=http://keycloak:8080/realms/fleet-management/protocol/openid-connect/certs
    depends_on:
      - postgres
      - kafka
    networks:
      - fleet-network

  evenement-service:
    build:
      context: ./services/evenement-service
      dockerfile: Dockerfile
    container_name: fleet-evenement-service
    ports:
      - "8003:8000" 
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/evenements
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - fleet-network

  localisation-service:
    build:
      context: ./services/localisation-service
      dockerfile: Dockerfile
    container_name: fleet-localisation-service
    ports:
      - "50051:50051" 
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@timescaledb:5432/localisation_db
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - timescaledb
      - kafka
    networks:
      - fleet-network

# ==========================================
# --- 3. VOLUMES ET RÉSEAUX ---
# ==========================================
volumes:
  postgres_data:
  timescale_data:
  redis_data:
  kafka_data:

networks:
  fleet-network:
    driver: bridge