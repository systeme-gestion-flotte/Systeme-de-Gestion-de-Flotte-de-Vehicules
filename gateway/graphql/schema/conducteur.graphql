scalar Date
scalar DateTime
scalar UUID

enum StatutAssignation {
  EN_COURS
  TERMINEE
  ANNULEE
}

type Conducteur {
  id_conducteur: UUID!
  keycloak_user_id: String!
  nom: String!
  prenom: String!
  email: String!
  numero_permis: String!
  date_validite_permis: Date!
  actif: Boolean!
  created_at: DateTime!
}

type Assignation {
  id_assignation: UUID!
  vehicule_id: UUID!
  conducteur_id: UUID!
  date_depart: DateTime!
  date_retour: DateTime
  statut: StatutAssignation!
  created_at: DateTime!
}

input CreateConducteurInput {
  keycloak_user_id: String!
  nom: String!
  prenom: String!
  email: String!
  numero_permis: String!
  date_validite_permis: Date!
}

input UpdateConducteurInput {
  email: String
  date_validite_permis: Date
  actif: Boolean
}

input CreateAssignationInput {
  vehicule_id: UUID!
  conducteur_id: UUID!
  date_depart: DateTime!
}

type Query {
  conducteurs(actif: Boolean, page: Int = 1, limit: Int = 20): [Conducteur!]!
  conducteur(id: UUID!): Conducteur
  assignations(statut: StatutAssignation, vehicule_id: UUID): [Assignation!]!
}

type Mutation {
  createConducteur(input: CreateConducteurInput!): Conducteur!
  updateConducteur(id: UUID!, input: UpdateConducteurInput!): Conducteur!
  deactivateConducteur(id: UUID!): Boolean!

  createAssignation(input: CreateAssignationInput!): Assignation!
  terminerAssignation(id: UUID!, date_retour: DateTime!): Assignation!
  annulerAssignation(id: UUID!): Assignation!
}
