global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: 'fleet-spring-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['vehicule-service:4000']
  - job_name: 'fleet-conducteur-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['conducteur-service:9464']
