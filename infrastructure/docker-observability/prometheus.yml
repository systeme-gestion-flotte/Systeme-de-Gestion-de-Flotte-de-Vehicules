global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: 'fleet-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['vehicule-service:4000', 'conducteur-service:3000']
