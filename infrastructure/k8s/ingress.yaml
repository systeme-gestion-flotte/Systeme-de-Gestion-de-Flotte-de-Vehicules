apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-ingress-traefik
  namespace: fleet-management
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: fleet-management-stripprefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.fleet.local
      http:
        paths:
          - path: /vehicules
            pathType: Prefix
            backend:
              service:
                name: vehicule-service
                port:
                  number: 4000
          - path: /conducteurs
            pathType: Prefix
            backend:
              service:
                name: conducteur-service
                port:
                  number: 3000
          - path: /maintenance
            pathType: Prefix
            backend:
              service:
                name: maintenance-service
                port:
                  number: 8000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-ingress-nginx
  namespace: fleet-management
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: api.fleet.local
      http:
        paths:
          - path: /api/vehicules/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: vehicule-service
                port:
                  number: 4000
          - path: /api/conducteurs/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: conducteur-service
                port:
                  number: 3000
          - path: /api/maintenance/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: maintenance-service
                port:
                  number: 8000