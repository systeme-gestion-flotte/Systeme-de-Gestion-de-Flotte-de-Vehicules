apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-ingress
  namespace: fleet-management
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: web
spec:
  ingressClassName: traefik
  rules:
    - host: api.fleet.local
      http:
        paths:
          - path: /vehicules
            pathType: Prefix
            backend:
              service:
                name: vehicule-service
                port:
                  number: 4000
          - path: /conducteurs
            pathType: Prefix
            backend:
              service:
                name: conducteur-service
                port:
                  number: 3000
          - path: /maintenance
            pathType: Prefix
            backend:
              service:
                name: maintenance-service
                port:
                  number: 8000
          - path: /evenements
            pathType: Prefix
            backend:
              service:
                name: evenement-service
                port:
                  number: 8000
          - path: /localisation
            pathType: Prefix
            backend:
              service:
                name: localisation-service
                port:
                  number: 50051